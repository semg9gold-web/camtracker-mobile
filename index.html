<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>🎯 CamTracker Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Segoe UI',sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#vw{position:relative;flex:1;overflow:hidden;min-height:0}
video{width:100%;height:100%;object-fit:cover;display:block}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10;gap:.4rem}
.badge{background:rgba(0,0,0,.75);backdrop-filter:blur(8px);padding:.28rem .65rem;border-radius:20px;font-size:.75rem;font-weight:700;white-space:nowrap}
#cam-btn{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);border:1px solid #333;color:#fff;padding:.38rem .75rem;border-radius:18px;font-size:.78rem;cursor:pointer;z-index:20}
#mode-bar{display:flex;overflow-x:auto;gap:.4rem;padding:.55rem .7rem;background:rgba(0,0,0,.92);border-top:1px solid #1a1a2e;flex-shrink:0;scrollbar-width:none}
#mode-bar::-webkit-scrollbar{display:none}
.mode-btn{background:rgba(255,255,255,.07);border:1px solid #2a2a3a;color:#aaa;padding:.38rem .85rem;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.mode-btn.active{background:linear-gradient(135deg,#6c63ff,#a855f7);border-color:transparent;color:#fff}
#panel{background:rgba(0,0,0,.9);padding:.55rem .8rem;border-top:1px solid #1a1a2e;flex-shrink:0;max-height:28vh;overflow-y:auto}
#panel h3{font-size:.68rem;text-transform:uppercase;color:#555;letter-spacing:1px;margin-bottom:.35rem}
#det-list{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{padding:.2rem .55rem;border-radius:14px;font-size:.75rem;font-weight:700;white-space:nowrap}
.empty{color:#555;font-size:.8rem}
#loading{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:100}
.spinner{width:36px;height:36px;border:3px solid #222;border-top-color:#8b80ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Toast auto-save visage */
#face-toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,230,118,.15);border:1px solid #00e676;color:#00e676;padding:.6rem 1.2rem;border-radius:12px;font-size:.85rem;font-weight:700;z-index:50;display:none;white-space:nowrap;backdrop-filter:blur(8px)}
/* Prompt nom visage */
#name-prompt{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:60;padding:2rem}
#name-prompt.open{display:flex}
#name-prompt h3{font-size:1.1rem}
#name-prompt img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #6c63ff}
#name-input{background:#1a1a26;border:1px solid #444;color:#fff;padding:.7rem 1rem;border-radius:10px;font-size:1rem;width:100%;max-width:280px;text-align:center}
.prompt-btns{display:flex;gap:.7rem;width:100%;max-width:280px}
.btn-ok{flex:1;background:linear-gradient(135deg,#6c63ff,#a855f7);border:none;color:#fff;padding:.6rem;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer}
.btn-skip{flex:1;background:rgba(255,255,255,.08);border:1px solid #333;color:#aaa;padding:.6rem;border-radius:10px;font-size:.9rem;cursor:pointer}
/* Liste personnes connues */
#known-list{position:absolute;bottom:120px;right:10px;max-width:160px;z-index:30;display:none}
.known-chip{background:rgba(0,0,0,.8);border:1px solid #6c63ff;color:#fff;padding:.25rem .6rem;border-radius:10px;font-size:.72rem;margin:.15rem 0;display:block}
</style>
</head>
<body>

<div id="loading">
  <div style="font-size:3rem">🎯</div>
  <div class="spinner"></div>
  <p id="load-msg">Chargement...</p>
</div>

<div id="vw">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <span class="badge" style="color:#8b80ff" id="fps-b">⚡ 0 FPS</span>
    <span class="badge" style="color:#80ffb0" id="info-b">—</span>
  </div>
  <button id="cam-btn" onclick="switchCam()">🔄</button>
  <div id="face-toast">✅ Visage enregistré !</div>
  <div id="known-list"></div>
</div>

<!-- Prompt nom -->
<div id="name-prompt">
  <h3>👤 Nouveau visage détecté</h3>
  <img id="face-snap" alt="visage">
  <p style="color:#888;font-size:.85rem">Quel est le nom de cette personne ?</p>
  <input type="text" id="name-input" placeholder="Prénom Nom" maxlength="30">
  <div class="prompt-btns">
    <button class="btn-skip" onclick="skipFace()">Ignorer</button>
    <button class="btn-ok"   onclick="confirmFace()">✅ Enregistrer</button>
  </div>
</div>

<div id="mode-bar">
  <button class="mode-btn active" onclick="setMode('objects')" id="btn-objects">🎯 Objets</button>
  <button class="mode-btn"        onclick="setMode('speed')"   id="btn-speed">⚡ Vitesse</button>
  <button class="mode-btn"        onclick="setMode('pose')"    id="btn-pose">🦴 Corps</button>
  <button class="mode-btn"        onclick="setMode('face')"    id="btn-face">😊 Visage</button>
  <button class="mode-btn"        onclick="setMode('hands')"   id="btn-hands">🖐️ Mains</button>
</div>

<div id="panel">
  <h3>🔍 Détections</h3>
  <div id="det-list"><span class="empty">En attente...</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.6/dist/face-landmarks-detection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js/dist/face-api.min.js"></script>

<script>
// ── Traductions ───────────────────────────────────────────────────────────────
const FR={person:"personne",bicycle:"vélo",car:"voiture",motorcycle:"moto",airplane:"avion",bus:"bus",train:"train",truck:"camion",boat:"bateau","traffic light":"feu",bench:"banc",bird:"oiseau",cat:"chat",dog:"chien",horse:"cheval",sheep:"mouton",cow:"vache",elephant:"éléphant",bear:"ours",zebra:"zèbre",giraffe:"girafe",backpack:"sac à dos",umbrella:"parapluie",handbag:"sac",suitcase:"valise",bottle:"bouteille","wine glass":"verre",cup:"tasse",fork:"fourchette",knife:"couteau",spoon:"cuillère",bowl:"bol",banana:"banane",apple:"pomme",pizza:"pizza",donut:"donut",cake:"gâteau",chair:"chaise",couch:"canapé","potted plant":"plante",bed:"lit","dining table":"table",toilet:"toilettes",tv:"télé",laptop:"laptop",mouse:"souris",remote:"télécommande",keyboard:"clavier","cell phone":"téléphone",microwave:"micro-ondes",oven:"four",sink:"évier",refrigerator:"frigo",book:"livre",clock:"horloge",vase:"vase",scissors:"ciseaux","teddy bear":"nounours"};

const COLORS={};
function getColor(k){if(!COLORS[k]){let h=0;for(const c of k)h=c.charCodeAt(0)+((h<<5)-h);COLORS[k]=`hsl(${Math.abs(h)%360},85%,62%)`;}return COLORS[k];}

// ── État ──────────────────────────────────────────────────────────────────────
let video,canvas,ctx,facingMode="environment",stream=null,running=false;
let currentMode="objects";
let models={coco:null,mn:null,pose:null,hand:null,faceMesh:null,faceapi:false};
let lastDets=[],lastPoses=[],lastHands=[],lastFaceMesh=[];
let lastFaceRec=[];
let frameCount=0,lastT=Date.now();

// Vitesse — historique positions
const posHistory={}; // {id: [{x,y,t}]}
const HISTORY_LEN=8;
const PX_PER_M=160;

// Visage — auto-enregistrement
let knownFaces=[];
let facePresence={}; // {hash: {count, descriptor, imageData}}
let pendingFace=null;
let promptOpen=false;
const PRESENCE_THRESHOLD=25; // frames avant prompt

// ── Caméra ────────────────────────────────────────────────────────────────────
async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:{ideal:1280},height:{ideal:720}},audio:false});}
  catch(e){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
  video.srcObject=stream;
  await new Promise(r=>video.onloadedmetadata=r);
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
}
function switchCam(){facingMode=facingMode==="environment"?"user":"environment";startCam();}

// ── Modes ─────────────────────────────────────────────────────────────────────
function setMode(m){
  currentMode=m;
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+m).classList.add("active");
  lastDets=[];lastPoses=[];lastHands=[];lastFaceMesh=[];lastFaceRec=[];
  Object.keys(posHistory).forEach(k=>delete posHistory[k]);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  updatePanel([]);
  // Afficher liste personnes connues en mode visage
  const kl=document.getElementById("known-list");
  if(m==="face"&&knownFaces.length){
    kl.style.display="block";
    kl.innerHTML=knownFaces.map(f=>`<span class="known-chip">👤 ${f.name}</span>`).join("");
  }else{kl.style.display="none";}
}

// ── Reconnaissance faciale ────────────────────────────────────────────────────
function loadKnownFaces(){
  try{const d=JSON.parse(localStorage.getItem("ct_faces")||"[]");
    knownFaces=d.map(f=>({...f,descriptor:new Float32Array(f.descriptor)}));}catch(e){}
}
function saveKnownFaces(){
  try{localStorage.setItem("ct_faces",JSON.stringify(knownFaces.map(f=>({...f,descriptor:Array.from(f.descriptor)}))));}catch(e){}
}
function matchFace(desc){
  let best=null,bestD=Infinity;
  for(const kf of knownFaces){
    const d=faceapi.euclideanDistance(desc,kf.descriptor);
    if(d<bestD){bestD=d;best=kf;}
  }
  return bestD<0.5?best:null;
}

// Auto-prompt enregistrement
function maybeSaveNewFace(descriptor,box){
  if(promptOpen||!models.faceapi)return;
  const bx=box.x||box.left||box.xMin||0, by=box.y||box.top||box.yMin||0;
  const key=Math.round(bx/50)+","+Math.round(by/50);
  if(!facePresence[key])facePresence[key]={count:0,descriptor,box};
  facePresence[key].count++;
  if(facePresence[key].count===PRESENCE_THRESHOLD){
    const tmp=document.createElement("canvas");
    const pad=20, bw=box.width||80, bh=box.height||80;
    tmp.width=bw+pad*2;tmp.height=bh+pad*2;
    const tc=tmp.getContext("2d");
    tc.drawImage(video,bx-pad,by-pad,tmp.width,tmp.height,0,0,tmp.width,tmp.height);
    pendingFace={descriptor,imgUrl:tmp.toDataURL("image/jpeg",0.85)};
    document.getElementById("face-snap").src=pendingFace.imgUrl;
    document.getElementById("name-input").value="";
    document.getElementById("name-prompt").classList.add("open");
    promptOpen=true;
    facePresence={};
  }
}
function confirmFace(){
  const name=document.getElementById("name-input").value.trim();
  if(!name)return;
  knownFaces.push({name,descriptor:pendingFace.descriptor,imgUrl:pendingFace.imgUrl});
  saveKnownFaces();
  pendingFace=null;promptOpen=false;
  document.getElementById("name-prompt").classList.remove("open");
  showToast(`✅ ${name} enregistré(e) !`);
  // MAJ liste
  setMode("face");
}
function skipFace(){
  pendingFace=null;promptOpen=false;
  document.getElementById("name-prompt").classList.remove("open");
}
function showToast(msg){
  const t=document.getElementById("face-toast");
  t.textContent=msg;t.style.display="block";
  setTimeout(()=>t.style.display="none",2500);
}

// ── Boucles IA ────────────────────────────────────────────────────────────────
async function aiLoop(){
  while(running){
    try{
      // OBJETS
      if(currentMode==="objects"){
        if(models.coco){
          const p=await models.coco.detect(video,15,0.35);
          lastDets=p.map(d=>({name:FR[d.class]||d.class,cls:d.class,conf:Math.round(d.score*100),x:d.bbox[0],y:d.bbox[1],w:d.bbox[2],h:d.bbox[3]}));
        }
        updatePanel(lastDets.map(d=>`${d.name} ${d.conf}%`));
      }
      // VITESSE / POSE
      else if(currentMode==="speed"||currentMode==="pose"){
        if(models.pose){
          lastPoses=await models.pose.estimatePoses(video,{maxPoses:3});
          const now=Date.now();
          lastPoses.forEach((pose,pi)=>{
            const kps=pose.keypoints;
            if(!posHistory[pi])posHistory[pi]=[];
            // Utiliser midpoint épaules pour meilleure stabilité
            const ls=kps[5],rs=kps[6];
            if(ls&&rs&&ls.score>0.3&&rs.score>0.3){
              posHistory[pi].push({x:(ls.x+rs.x)/2,y:(ls.y+rs.y)/2,t:now});
              if(posHistory[pi].length>HISTORY_LEN)posHistory[pi].shift();
            }
          });
          if(currentMode==="speed")updatePanel(lastPoses.map((_,i)=>{
            const s=getSpeed(i);return s?`Personne ${i+1}: ${s.kmh} km/h`:`Personne ${i+1}`;
          }));
          else updatePanel(lastPoses.map((_,i)=>`Personne ${i+1}`));
        }
      }
      // MAINS
      else if(currentMode==="hands"){
        if(models.hand){
          lastHands=await models.hand.estimateHands(video,{flipHorizontal:false});
          updatePanel(lastHands.map((h,i)=>`Main ${i+1} (${h.handedness==="Left"?"Gauche":"Droite"})`));
        }
      }
      // VISAGE
      else if(currentMode==="face"){
        if(models.faceMesh){
          lastFaceMesh=await models.faceMesh.estimateFaces(video);
        }
        if(models.faceapi){
          const dets=await faceapi.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions({scoreThreshold:0.4})).withFaceLandmarks(true).withFaceDescriptors();
          lastFaceRec=dets.map(d=>{
            const match=matchFace(d.descriptor);
            const box=d.detection.box;
            if(!match)maybeSaveNewFace(d.descriptor,box);
            return{box,name:match?match.name:null};
          });
          updatePanel(lastFaceRec.map(f=>f.name?`👤 ${f.name}`:"Inconnu"));
        }
      }
    }catch(e){console.error(e);}
    await new Promise(r=>setTimeout(r,80));
  }
}

function updatePanel(items){
  document.getElementById("info-b").textContent=`${items.length} résultat${items.length!==1?"s":""}`;
  const list=document.getElementById("det-list");
  if(!items.length){list.innerHTML='<span class="empty">Aucune détection</span>';return;}
  list.innerHTML=items.map((n,i)=>{const col=i<lastDets.length?getColor(lastDets[i].cls):"#ffa040";return`<span class="chip" style="border:1px solid ${col};color:${col}">${n}</span>`;}).join("");
}

// ── Calcul vitesse avec historique ────────────────────────────────────────────
function getSpeed(pi){
  const h=posHistory[pi];
  if(!h||h.length<3)return null;
  const old=h[0],cur=h[h.length-1];
  const dx=cur.x-old.x,dy=cur.y-old.y;
  const dist=Math.sqrt(dx*dx+dy*dy)/PX_PER_M;
  const dt=(cur.t-old.t)/1000;
  if(dt<0.05)return null;
  const ms=dist/dt;
  return{kmh:Math.round(ms*3.6*10)/10,dx,dy,x:cur.x,y:cur.y,ms};
}

// ── Rendu flèche ──────────────────────────────────────────────────────────────
function drawArrow(x,y,dx,dy,speed,col){
  if(speed<0.3)return; // Pas de flèche si quasi immobile
  const len=Math.sqrt(dx*dx+dy*dy);
  if(len<1)return;
  const nx=dx/len,ny=dy/len;
  const arrowLen=Math.min(60+speed*15,130);
  const ex=x+nx*arrowLen,ey=y+ny*arrowLen;
  // Corps
  ctx.save();
  ctx.strokeStyle=col;ctx.fillStyle=col;
  ctx.lineWidth=10;ctx.lineCap="round";
  ctx.shadowColor=col;ctx.shadowBlur=16;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();
  // Tête (triangle)
  const headLen=28,headW=16;
  const bx=ex-nx*headLen,by=ey-ny*headLen;
  const px=-ny*headW,py=nx*headW;
  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(bx+px,by+py);
  ctx.lineTo(bx-px,by-py);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}

// ── Squelette segments ────────────────────────────────────────────────────────
const SEGS=[
  {a:5,b:7,c:"#ff6584"},{a:7,b:9,c:"#ff6584"},   // bras G
  {a:6,b:8,c:"#6c63ff"},{a:8,b:10,c:"#6c63ff"},   // bras D
  {a:11,b:13,c:"#ff8c40"},{a:13,b:15,c:"#ff8c40"},{a:15,b:17,c:"#ff8c40"}, // jambe G
  {a:12,b:14,c:"#40c8ff"},{a:14,b:16,c:"#40c8ff"},{a:16,b:18,c:"#40c8ff"}, // jambe D
  {a:5,b:6,c:"#80ffb0"},{a:11,b:12,c:"#80ffb0"},  // épaules/hanches
  {a:5,b:11,c:"#ffd700"},{a:6,b:12,c:"#ffd700"},  // torse
  {a:0,b:5,c:"#fff"},{a:0,b:6,c:"#fff"},           // cou
];

// Connexions mains par doigt (MediaPipe 21 points)
const FINGER_COLS=["#ff6584","#ffa040","#f0c040","#80ffb0","#6c63ff"];
const FINGER_SEGS=[[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20]];

// ── Rendu 60fps ───────────────────────────────────────────────────────────────
function renderLoop(){
  if(!running)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // OBJETS
  if(currentMode==="objects"){
    for(const d of lastDets){
      const{x,y,w,h,name,conf,cls}=d;
      const col=getColor(cls);
      ctx.strokeStyle=col;ctx.lineWidth=3;ctx.shadowColor=col;ctx.shadowBlur=10;
      ctx.strokeRect(x,y,w,h);ctx.shadowBlur=0;
      const lbl=`${name} ${conf}%`;
      ctx.font="bold 15px 'Segoe UI'";
      const tw=ctx.measureText(lbl).width;
      const ly=y>30?y-6:y+h+20;
      ctx.fillStyle=col;ctx.fillRect(x-1,ly-19,tw+14,22);
      ctx.fillStyle="#000";ctx.fillText(lbl,x+6,ly-2);
    }
  }

  // SQUELETTE / VITESSE
  else if(currentMode==="pose"||currentMode==="speed"){
    for(let pi=0;pi<lastPoses.length;pi++){
      const kps=lastPoses[pi].keypoints;
      const personCol=`hsl(${(pi*90)%360},85%,65%)`;
      // Segments colorés
      for(const seg of SEGS){
        const a=kps[seg.a],b=kps[seg.b];
        if(!a||!b||a.score<0.25||b.score<0.25)continue;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=seg.c;ctx.lineWidth=5;ctx.lineCap="round";
        ctx.shadowColor=seg.c;ctx.shadowBlur=5;ctx.stroke();ctx.shadowBlur=0;
      }
      // Points articulaires
      for(const kp of kps){
        if(kp.score<0.25)continue;
        ctx.beginPath();ctx.arc(kp.x,kp.y,7,0,Math.PI*2);
        ctx.fillStyle="#fff";ctx.fill();
        ctx.beginPath();ctx.arc(kp.x,kp.y,5,0,Math.PI*2);
        ctx.fillStyle=personCol;ctx.fill();
      }
      // Flèche vitesse
      if(currentMode==="speed"){
        const s=getSpeed(pi);
        if(s){
          drawArrow(s.x,s.y,s.dx,s.dy,s.ms,"#00e676");
          ctx.font="bold 20px 'Segoe UI'";
          const lbl=`${s.kmh} km/h`;
          const tw=ctx.measureText(lbl).width;
          ctx.fillStyle="rgba(0,0,0,.82)";ctx.fillRect(s.x-tw/2-8,s.y-58,tw+16,28);
          ctx.fillStyle="#00e676";ctx.shadowColor="#00e676";ctx.shadowBlur=8;
          ctx.fillText(lbl,s.x-tw/2,s.y-34);ctx.shadowBlur=0;
        }
      }
    }
  }

  // MAINS
  else if(currentMode==="hands"){
    for(const hand of lastHands){
      // HandPose retourne keypoints ET keypoints3D — on utilise keypoints (2D)
      const kps=hand.keypoints||hand.landmarks||[];
      if(!kps.length)continue;
      const isLeft=(hand.handedness||"Right")==="Left";
      const score=hand.score||1;
      // Dessiner chaque doigt
      FINGER_SEGS.forEach((finger,fi)=>{
        const col=FINGER_COLS[fi];
        ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineCap="round";
        ctx.shadowColor=col;ctx.shadowBlur=7;
        // Tracer le doigt en continu
        ctx.beginPath();
        let started=false;
        for(const idx of finger){
          const k=kps[idx];if(!k)continue;
          if(!started){ctx.moveTo(k.x,k.y);started=true;}
          else ctx.lineTo(k.x,k.y);
        }
        ctx.stroke();ctx.shadowBlur=0;
        // Points articulaires
        for(const idx of finger){
          const k=kps[idx];if(!k)continue;
          ctx.beginPath();ctx.arc(k.x,k.y,7,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
          ctx.beginPath();ctx.arc(k.x,k.y,5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
        }
      });
      // Paume (connexion entre base des doigts)
      const palmIdx=[0,5,9,13,17,0];
      ctx.strokeStyle="rgba(255,255,255,0.4)";ctx.lineWidth=3;
      ctx.beginPath();
      palmIdx.forEach((idx,i)=>{
        const k=kps[idx];if(!k)return;
        i===0?ctx.moveTo(k.x,k.y):ctx.lineTo(k.x,k.y);
      });
      ctx.stroke();
      // Label
      const wrist=kps[0];
      if(wrist){
        const lbl=isLeft?"✋ Gauche":"🤚 Droite";
        ctx.font="bold 14px 'Segoe UI'";
        const tw=ctx.measureText(lbl).width;
        ctx.fillStyle="rgba(0,0,0,.8)";ctx.fillRect(wrist.x-tw/2-6,wrist.y-32,tw+12,22);
        ctx.fillStyle=isLeft?"#6c63ff":"#ff6584";
        ctx.fillText(lbl,wrist.x-tw/2,wrist.y-14);
      }
    }
  }

  // VISAGE
  else if(currentMode==="face"){
    // Points maillage
    for(const face of lastFaceMesh){
      if(face.keypoints){
        ctx.fillStyle="rgba(255,101,132,0.5)";
        for(let i=0;i<face.keypoints.length;i+=2){
          const k=face.keypoints[i];
          ctx.beginPath();ctx.arc(k.x,k.y,1.8,0,Math.PI*2);ctx.fill();
        }
      }
    }
    // Rectangles + noms (reconnaissance)
    for(const f of lastFaceRec){
      const b=f.box;
      // face-api box: {x,y,width,height} ou {left,top,width,height}
      const bx=b.x||b.left||0, by=b.y||b.top||0, bw=b.width||80, bh=b.height||80;
      const col=f.name?"#00e676":"rgba(255,255,255,0.4)";
      ctx.strokeStyle=col;ctx.lineWidth=3;ctx.shadowColor=col;ctx.shadowBlur=8;
      ctx.strokeRect(bx,by,bw,bh);ctx.shadowBlur=0;
      if(f.name){
        ctx.font="bold 17px 'Segoe UI'";
        const tw=ctx.measureText(f.name).width;
        ctx.fillStyle="#00e676";ctx.fillRect(bx-1,by-24,tw+14,22);
        ctx.fillStyle="#000";ctx.fillText(f.name,bx+6,by-6);
      }
    }
  }

  frameCount++;const now=Date.now();
  if(now-lastT>=1000){document.getElementById("fps-b").textContent=`⚡ ${Math.round(frameCount*1000/(now-lastT))} FPS`;frameCount=0;lastT=now;}
  requestAnimationFrame(renderLoop);
}

// ── Init modèles ──────────────────────────────────────────────────────────────
async function init(){
  video=document.getElementById("video");canvas=document.getElementById("canvas");ctx=canvas.getContext("2d");
  loadKnownFaces();

  document.getElementById("load-msg").textContent="Caméra...";
  await startCam();

  document.getElementById("load-msg").textContent="YOLO objets (1/6)...";
  models.coco=await cocoSsd.load({base:"lite_mobilenet_v2"});

  document.getElementById("load-msg").textContent="MoveNet corps (2/6)...";
  try{models.pose=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING});}catch(e){
    try{models.pose=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});}catch(e2){console.warn(e2);}
  }

  document.getElementById("load-msg").textContent="HandPose mains (3/6)...";
  try{models.hand=await handPoseDetection.createDetector(handPoseDetection.SupportedModels.MediaPipeHands,{runtime:"tfjs",modelType:"full"});}catch(e){console.warn(e);}

  document.getElementById("load-msg").textContent="FaceMesh (4/6)...";
  try{models.faceMesh=await faceLandmarksDetection.createDetector(faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh,{runtime:"tfjs",refineLandmarks:false});}catch(e){console.warn(e);}

  document.getElementById("load-msg").textContent="Face Recognition (5/6)...";
  try{
    const W="https://cdn.jsdelivr.net/npm/face-api.js/weights/";
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(W),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(W),
      faceapi.nets.faceRecognitionNet.loadFromUri(W),
    ]);
    models.faceapi=true;
  }catch(e){console.warn("face-api:",e);}

  document.getElementById("load-msg").textContent="Prêt !";
  await new Promise(r=>setTimeout(r,400));
  document.getElementById("loading").style.display="none";
  running=true;
  aiLoop();
  requestAnimationFrame(renderLoop);
}

init().catch(e=>{document.getElementById("load-msg").textContent="Erreur: "+e.message;console.error(e);});
</script>
