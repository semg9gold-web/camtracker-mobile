<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>🎯 CamTracker Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Segoe UI',sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#vw{position:relative;flex:1;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
/* HUD */
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10;gap:.4rem;flex-wrap:wrap}
.badge{background:rgba(0,0,0,.75);backdrop-filter:blur(8px);padding:.28rem .65rem;border-radius:20px;font-size:.75rem;font-weight:700;white-space:nowrap}
/* Bouton caméra */
#cam-btn{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1px solid #333;color:#fff;padding:.38rem .75rem;border-radius:18px;font-size:.78rem;cursor:pointer;z-index:20}
/* Sélecteur de mode */
#mode-bar{display:flex;overflow-x:auto;gap:.45rem;padding:.6rem .8rem;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);border-top:1px solid #1a1a2e;flex-shrink:0;scrollbar-width:none}
#mode-bar::-webkit-scrollbar{display:none}
.mode-btn{background:rgba(255,255,255,.07);border:1px solid #2a2a3a;color:#aaa;padding:.4rem .9rem;border-radius:20px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0}
.mode-btn.active{background:linear-gradient(135deg,#6c63ff,#a855f7);border-color:transparent;color:#fff}
/* Panel bas */
#panel{background:rgba(0,0,0,.88);backdrop-filter:blur(12px);padding:.6rem .9rem;border-top:1px solid #1a1a2e;flex-shrink:0;max-height:38vh;overflow-y:auto}
#panel h3{font-size:.7rem;text-transform:uppercase;color:#666;letter-spacing:1px;margin-bottom:.4rem}
#det-list{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{padding:.22rem .6rem;border-radius:16px;font-size:.78rem;font-weight:700;white-space:nowrap}
.empty{color:#555;font-size:.82rem}
/* Loading */
#loading{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:100}
#loading .icon{font-size:3.5rem}
#loading p{color:#888;font-size:.9rem;text-align:center;padding:0 2rem}
.spinner{width:36px;height:36px;border:3px solid #222;border-top-color:#8b80ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Vitesse */
.speed-tag{position:absolute;background:rgba(0,0,0,.8);padding:.2rem .5rem;border-radius:8px;font-size:.75rem;font-weight:800;color:#00e676;pointer-events:none}
</style>
</head>
<body>

<div id="loading">
  <div class="icon">🎯</div>
  <div class="spinner"></div>
  <p id="load-msg">Chargement modèles...</p>
</div>

<div id="vw">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <span class="badge" style="color:#8b80ff" id="fps-b">⚡ 0 FPS</span>
    <span class="badge" style="color:#80ffb0" id="info-b">—</span>
  </div>
  <button id="cam-btn" onclick="switchCam()">🔄</button>
</div>

<div id="mode-bar">
  <button class="mode-btn active" onclick="setMode('objects')"   id="btn-objects">🎯 Objets</button>
  <button class="mode-btn"        onclick="setMode('speed')"    id="btn-speed">⚡ Vitesse</button>
  <button class="mode-btn"        onclick="setMode('pose')"     id="btn-pose">🦴 Squelette</button>
  <button class="mode-btn"        onclick="setMode('face')"     id="btn-face">😊 Visage</button>
  <button class="mode-btn"        onclick="setMode('hands')"    id="btn-hands">🖐️ Mains</button>
</div>

<div id="panel">
  <h3 id="panel-title">🔍 Détections</h3>
  <div id="det-list"><span class="empty">En attente...</span></div>
</div>

<!-- TF.js core -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<!-- COCO-SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<!-- MobileNet -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<!-- MoveNet (pose + vitesse) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<!-- HandPose -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"></script>
<!-- FaceMesh -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.6/dist/face-landmarks-detection.min.js"></script>

<script>
// ── Traductions ───────────────────────────────────────────────────────────────
const FR={person:"personne",bicycle:"vélo",car:"voiture",motorcycle:"moto",airplane:"avion",bus:"bus",train:"train",truck:"camion",boat:"bateau","traffic light":"feu",bench:"banc",bird:"oiseau",cat:"chat",dog:"chien",horse:"cheval",sheep:"mouton",cow:"vache",elephant:"éléphant",bear:"ours",zebra:"zèbre",giraffe:"girafe",backpack:"sac à dos",umbrella:"parapluie",handbag:"sac",suitcase:"valise",bottle:"bouteille","wine glass":"verre",cup:"tasse",fork:"fourchette",knife:"couteau",spoon:"cuillère",bowl:"bol",banana:"banane",apple:"pomme",sandwich:"sandwich",orange:"orange",pizza:"pizza",donut:"donut",cake:"gâteau",chair:"chaise",couch:"canapé","potted plant":"plante",bed:"lit","dining table":"table",toilet:"toilettes",tv:"télé",laptop:"laptop",mouse:"souris",remote:"télécommande",keyboard:"clavier","cell phone":"téléphone",microwave:"micro-ondes",oven:"four",sink:"évier",refrigerator:"frigo",book:"livre",clock:"horloge",vase:"vase",scissors:"ciseaux","teddy bear":"nounours","hair drier":"sèche-cheveux",toothbrush:"brosse à dents"};

const COLORS={};
function getColor(k){if(!COLORS[k]){let h=0;for(const c of k)h=c.charCodeAt(0)+((h<<5)-h);COLORS[k]=`hsl(${Math.abs(h)%360},80%,62%)`;}return COLORS[k];}

// ── État global ───────────────────────────────────────────────────────────────
let video,canvas,ctx,facingMode="environment",stream=null,running=false;
let currentMode="objects";
let models={coco:null,mn:null,pose:null,hand:null,face:null};
let lastDets=[],lastScene="",lastPoses=[],lastHands=[],lastFaces=[];
let frameCount=0,lastT=Date.now();

// Vitesse: positions précédentes des keypoints
const prevPositions={};
const PIXELS_PER_METER=200; // calibration approx (peut varier)
const speeds={};

// ── Caméra ────────────────────────────────────────────────────────────────────
async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;
  await new Promise(r=>video.onloadedmetadata=r);
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
}
function switchCam(){facingMode=facingMode==="environment"?"user":"environment";startCam();}

// ── Modes ─────────────────────────────────────────────────────────────────────
function setMode(m){
  currentMode=m;
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+m).classList.add("active");
  lastDets=[];lastPoses=[];lastHands=[];lastFaces=[];lastScene="";
  ctx.clearRect(0,0,canvas.width,canvas.height);
  updatePanel([]);
}

// ── Boucles IA ────────────────────────────────────────────────────────────────
async function aiLoop(){
  while(running){
    try{
      if(currentMode==="objects"){
        if(models.coco){
          const p=await models.coco.detect(video,15,0.35);
          lastDets=p.map(d=>({name:FR[d.class]||d.class,cls:d.class,conf:Math.round(d.score*100),x:d.bbox[0],y:d.bbox[1],w:d.bbox[2],h:d.bbox[3]}));
        }
        if(models.mn){
          const mn=await models.mn.classify(video,3);
          lastScene=mn.filter(p=>p.probability>0.12).map(p=>{
            const t=p.className.replace(/,.*$/,"").replace(/_/g," ").split(" ").slice(0,2).join(" ");
            return t;
          }).join(", ");
        }
        updatePanel(lastDets.map(d=>d.name).concat(lastScene?[lastScene]:[]));
      }
      else if(currentMode==="speed"||currentMode==="pose"){
        if(models.pose){
          const poses=await models.pose.estimatePoses(video);
          lastPoses=poses;
          // Calculer vitesse
          const now=Date.now();
          poses.forEach((pose,pi)=>{
            const nose=pose.keypoints.find(k=>k.name==="nose");
            if(!nose||nose.score<0.3)return;
            const key="p"+pi;
            if(prevPositions[key]){
              const {x:px,y:py,t:pt}=prevPositions[key];
              const dx=nose.x-px,dy=nose.y-py;
              const dist=Math.sqrt(dx*dx+dy*dy)/PIXELS_PER_METER;
              const dt=(now-pt)/1000;
              const spd=dt>0?dist/dt:0;
              speeds[key]={v:Math.round(spd*3.6*10)/10,x:nose.x,y:nose.y};
            }
            prevPositions[key]={x:nose.x,y:nose.y,t:now};
          });
          const labels=poses.map((_,i)=>{
            const s=speeds["p"+i];
            return s?`Personne ${i+1}: ${s.v} km/h`:`Personne ${i+1}`;
          });
          updatePanel(labels);
        }
      }
      else if(currentMode==="hands"){
        if(models.hand){
          lastHands=await models.hand.estimateHands(video);
          updatePanel(lastHands.map((_,i)=>`Main ${i+1} détectée`));
        }
      }
      else if(currentMode==="face"){
        if(models.face){
          lastFaces=await models.face.estimateFaces(video);
          updatePanel(lastFaces.map((_,i)=>`Visage ${i+1}`));
        }
      }
    }catch(e){console.error(e);}
    await new Promise(r=>setTimeout(r,currentMode==="objects"?120:80));
  }
}

function updatePanel(items){
  document.getElementById("info-b").textContent=`${items.length} résultat${items.length!==1?"s":""}`;
  const list=document.getElementById("det-list");
  if(!items.length){list.innerHTML='<span class="empty">Aucune détection</span>';return;}
  list.innerHTML=items.map((n,i)=>{
    const col=i<lastDets.length?getColor(lastDets[i].cls):"#ffa040";
    return`<span class="chip" style="border:1px solid ${col};color:${col}">${n}</span>`;
  }).join("");
}

// ── Rendu canvas 60fps ────────────────────────────────────────────────────────
const SKELETON=[[5,7],[7,9],[6,8],[8,10],[5,6],[11,12],[5,11],[6,12],[11,13],[13,15],[12,14],[14,16]];
const HAND_CONNECTIONS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20]];

function renderLoop(){
  if(!running)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(currentMode==="objects"){
    for(const d of lastDets){
      const{x,y,w,h,name,conf,cls}=d;
      const col=getColor(cls);
      ctx.strokeStyle=col;ctx.lineWidth=3;ctx.shadowColor=col;ctx.shadowBlur=8;
      ctx.strokeRect(x,y,w,h);ctx.shadowBlur=0;
      const label=`${name}  ${conf}%`;
      ctx.font="bold 15px 'Segoe UI'";
      const tw=ctx.measureText(label).width;
      const ly=y>30?y-6:y+h+20;
      ctx.fillStyle=col;ctx.fillRect(x-1,ly-19,tw+14,22);
      ctx.fillStyle="#000";ctx.fillText(label,x+6,ly-2);
    }
  }
  else if(currentMode==="pose"||currentMode==="speed"){
    for(let pi=0;pi<lastPoses.length;pi++){
      const pose=lastPoses[pi];
      const kps=pose.keypoints;
      const col=`hsl(${(pi*60)%360},80%,65%)`;
      // Squelette
      ctx.strokeStyle=col;ctx.lineWidth=3;
      for(const[a,b]of SKELETON){
        const ka=kps[a],kb=kps[b];
        if(!ka||!kb||ka.score<0.3||kb.score<0.3)continue;
        ctx.beginPath();ctx.moveTo(ka.x,ka.y);ctx.lineTo(kb.x,kb.y);ctx.stroke();
      }
      // Points
      for(const kp of kps){
        if(kp.score<0.3)continue;
        ctx.beginPath();ctx.arc(kp.x,kp.y,5,0,Math.PI*2);
        ctx.fillStyle=col;ctx.fill();
      }
      // Vitesse
      if(currentMode==="speed"){
        const s=speeds["p"+pi];
        const nose=kps.find(k=>k.name==="nose");
        if(s&&nose&&nose.score>0.3){
          ctx.fillStyle="rgba(0,0,0,.75)";
          const label=`${s.v} km/h`;
          ctx.font="bold 18px 'Segoe UI'";
          const tw=ctx.measureText(label).width;
          ctx.fillRect(nose.x-tw/2-6,nose.y-45,tw+12,26);
          ctx.fillStyle="#00e676";
          ctx.fillText(label,nose.x-tw/2,nose.y-24);
        }
      }
    }
  }
  else if(currentMode==="hands"){
    for(const hand of lastHands){
      const kps=hand.keypoints;
      ctx.strokeStyle="#00e676";ctx.lineWidth=2;
      for(const[a,b]of HAND_CONNECTIONS){
        const ka=kps[a],kb=kps[b];
        if(!ka||!kb)continue;
        ctx.beginPath();ctx.moveTo(ka.x,ka.y);ctx.lineTo(kb.x,kb.y);ctx.stroke();
      }
      for(const kp of kps){
        ctx.beginPath();ctx.arc(kp.x,kp.y,5,0,Math.PI*2);
        ctx.fillStyle="#00e676";ctx.fill();
      }
      const wrist=kps[0];
      if(wrist){
        ctx.fillStyle="rgba(0,0,0,.75)";ctx.fillRect(wrist.x-30,wrist.y-28,60,20);
        ctx.fillStyle="#00e676";ctx.font="bold 13px 'Segoe UI'";
        ctx.fillText(hand.handedness==="Left"?"✋ Gauche":"🤚 Droite",wrist.x-27,wrist.y-12);
      }
    }
  }
  else if(currentMode==="face"){
    for(const face of lastFaces){
      const box=face.box;
      if(box){
        ctx.strokeStyle="#ff6584";ctx.lineWidth=2;ctx.shadowColor="#ff6584";ctx.shadowBlur=8;
        ctx.strokeRect(box.xMin,box.yMin,box.width,box.height);ctx.shadowBlur=0;
        ctx.fillStyle="rgba(0,0,0,.75)";ctx.fillRect(box.xMin,box.yMin-22,80,20);
        ctx.fillStyle="#ff6584";ctx.font="bold 13px 'Segoe UI'";
        ctx.fillText("😊 Visage",box.xMin+4,box.yMin-6);
      }
      // Points du maillage (sous-échantillonnage)
      if(face.keypoints){
        ctx.fillStyle="rgba(255,101,132,0.5)";
        for(let i=0;i<face.keypoints.length;i+=4){
          const k=face.keypoints[i];
          ctx.beginPath();ctx.arc(k.x,k.y,1.5,0,Math.PI*2);ctx.fill();
        }
      }
    }
  }

  // FPS
  frameCount++;const now=Date.now();
  if(now-lastT>=1000){
    document.getElementById("fps-b").textContent=`⚡ ${Math.round(frameCount*1000/(now-lastT))} FPS`;
    frameCount=0;lastT=now;
  }
  requestAnimationFrame(renderLoop);
}

// ── Chargement modèles ────────────────────────────────────────────────────────
async function loadModels(){
  const msg=document.getElementById("load-msg");

  msg.textContent="Caméra...";
  await startCam();

  msg.textContent="YOLO objets (1/5)...";
  models.coco=await cocoSsd.load({base:"lite_mobilenet_v2"});

  msg.textContent="MobileNet 1000 classes (2/5)...";
  models.mn=await mobilenet.load({version:2,alpha:1.0});

  msg.textContent="MoveNet squelette/vitesse (3/5)...";
  try{
    models.pose=await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      {modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING}
    );
  }catch(e){console.warn("MoveNet indispo:",e);}

  msg.textContent="HandPose mains (4/5)...";
  try{
    models.hand=await handPoseDetection.createDetector(
      handPoseDetection.SupportedModels.MediaPipeHands,
      {runtime:"tfjs",modelType:"lite"}
    );
  }catch(e){console.warn("HandPose indispo:",e);}

  msg.textContent="FaceMesh visage (5/5)...";
  try{
    models.face=await faceLandmarksDetection.createDetector(
      faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh,
      {runtime:"tfjs",refineLandmarks:false}
    );
  }catch(e){console.warn("FaceMesh indispo:",e);}
}

async function init(){
  video=document.getElementById("video");
  canvas=document.getElementById("canvas");
  ctx=canvas.getContext("2d");
  await loadModels();
  document.getElementById("loading").style.display="none";
  running=true;
  aiLoop();
  requestAnimationFrame(renderLoop);
}

init().catch(e=>{
  document.getElementById("load-msg").textContent="Erreur: "+e.message;
  console.error(e);
});
</script>
</body>
</html>
